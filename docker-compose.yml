version: '3.8'

services:
  inventaire-postgres:
    image: postgres:16-alpine
    container_name: inventaire-postgres
    environment:
      POSTGRES_DB: inventaire_produits
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - inventaire-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inventaire-pgdata:
